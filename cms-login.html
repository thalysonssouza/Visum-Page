<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visum | CMS Login</title>
    <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="Favicon 1.0.svg">
</head>
<body class="cms-bg" data-theme="visum">

    <div class="cms-login-container">
        <div class="cms-login-box">
            <div style="text-align: center; margin-bottom: 3rem;">
                <img src="assets/logo-visum.svg" alt="Visum" style="height: 24px;">
                <h3 style="margin-top: 1rem; font-weight: 400;">Workspace Admin</h3>
            </div>
            
            <div class="sso-buttons" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;">
                <button type="button" class="btn" onclick="cmsAuth.loginMicrosoft()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: #fff; color: #333; border: 1px solid var(--border-color);">
                    <svg width="18" height="18" viewBox="0 0 21 21"><path fill="#f25022" d="M1 1h9v9H1z"/><path fill="#00a4ef" d="M1 11h9v9H1z"/><path fill="#7fba00" d="M11 1h9v9h-9z"/><path fill="#ffb900" d="M11 11h9v9h-9z"/></svg>
                    Entrar com Microsoft
                </button>
                <button type="button" class="btn" onclick="cmsAuth.loginGoogle()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: #fff; color: #333; border: 1px solid var(--border-color);">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Entrar com Google
                </button>
            </div>
            
            <script type="module" src="cms-firebase.js"></script>
            <script type="module">
                import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
                window.onload = () => {
                    if (window.auth) {
                        onAuthStateChanged(window.auth, (user) => {
                            if (user) {
                                window.location.href = "cms-dashboard.html";
                            }
                        });
                    }
                }
            </script>
            
            <div style="text-align: center; margin-top: 2rem;">
                <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← Voltar ao site principal</a>
            </div>
        </div>
    </div>

</body>
</html>
